name: Code Quality Check

on:
  pull_request:
    branches: [ "ci/codequality/spotless" ]

jobs:
  always-run:
    runs-on: ubuntu-latest
    if: ${{ always() }}   # läuft immer, selbst wenn andere Jobs fehlschlagen
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Always run job
        run: echo "Dieser Job läuft immer, egal was passiert."


  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build project without tests
        run: mvn compile -DskipTests -B

      - name: Spotless check with Reviewdog
        uses: reviewdog/action-maven@v2
        with:
          maven_goals: "spotless:check"
          reporter: "github-pr-review"
          level: "error"

      # 5. Optional: Vorschläge automatisch generieren
      - name: Generate Patch Suggestions
        if: github.event_name == 'pull_request'
        run: |
          mvn spotless:apply -B
          git diff > patch.diff || true
          if [ -s patch.diff ]; then
            echo "Patch generated. Suggestions could be applied manually."
          else
            echo "No changes from Spotless."
          fi