name: Spotless Check

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write

jobs:
  spotless:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Spotless check
        id: spotless
        run: |
          if ./mvnw spotless:check; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "Spotless violations found!"
          fi

      - name: Comment on PR if failed
        if: steps.spotless.outputs.passed == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "⚠️ **Spotless Check**: Dein Code entspricht nicht dem Style-Guide.\nBitte `mvn spotless:apply` ausführen und die Änderungen committen."
            })

