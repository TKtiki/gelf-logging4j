name: Code Quality Check

on:
  pull_request:
    branches: [ "ci/codequality/spotless" ]

jobs:
  always-run:
    runs-on: ubuntu-latest
    if: ${{ always() }}   # läuft immer, selbst wenn andere Jobs fehlschlagen
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Always run job
        run: echo "Dieser Job läuft immer, egal was passiert."


  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build project without tests
        run: mvn compile -DskipTests -B

      - name: Install Reviewdog
        run: |
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b $(go env GOPATH)/bin latest
        shell: bash

      - name: Run Spotless check and report to Reviewdog
        run: |
          mvn spotless:check -B 2>&1 | reviewdog -f=checkstyle -name="spotless" -reporter=github-pr-review -level=error
        shell: bash
