name: Code Quality Check

on:
  pull_request:
    branches:
      - "/ci/codequality/spotless"

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Spotless check and send to reviewdog
        uses: reviewdog/action-suggester@v1
        with:
          tool_name: spotless
          # Führt Spotless im Apply-Mode aus, damit Vorschläge generiert werden
          # Dann gibt reviewdog die Änderungen als "Suggestions" im PR aus
          command: mvn spotless:apply