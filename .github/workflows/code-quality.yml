name: Code Quality Check

on:
  pull_request:
    branches: [ "ci/codequality/spotless" ]

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Run Spotless with reviewdog for inline PR comments
      - name: Run Spotless check with reviewdog
        uses: reviewdog/action-mvn@v2
        with:
          maven_goals: "spotless:check"
          reporter: github-pr-review    # Alternativ: github-pr-check
          level: error                  # Markiert als Fehler
          fail_on_error: true            # PR-Check schlägt fehl
